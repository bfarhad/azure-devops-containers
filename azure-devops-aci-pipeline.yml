trigger:
  - main
  - develop

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: 'deploy'
    values:
      - deploy
      - destroy

pool:
  vmImage: 'ubuntu-latest'

variables:
  # NOTE: ACR *name* must be alphanumeric only (no dashes). Login server is <name>.azurecr.io.
  acrName: 'cloudladderacr'
  acrLoginServer: 'cloudladderacr.azurecr.io'
  imageName: 'distroless-devops-agent'
  tag: 'latest'
  resourceGroup: 'global-management-RG'
  containerGroupName: 'devops-agent-aci'
  agentPoolName: 'aci-agent-pool'
  storageAccountName: 'centralwelogstorage'
  fileShareName: 'agent-files'
  vnetName: 'cl-we-dev-vnet'
  subnetName: 'Servers'

stages:
- stage: DeployACI
  condition: eq('${{ parameters.action }}', 'deploy')
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: 'Get storage account key'
      inputs:
        azureSubscription: 'CL-demo-sub1(648f668b-eaab-4a61-914a-190c7a924419)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Get storage account key
          storageAccountKey=$(az storage account keys list --resource-group $(resourceGroup) --account-name $(storageAccountName) --query '[0].value' -o tsv)
          echo "##vso[task.setvariable variable=storageAccountKey]$storageAccountKey"

    - task: AzureCLI@2
      displayName: 'Deploy Azure Container Instance with DevOps Agent'
      inputs:
        azureSubscription: 'CL-demo-sub1(648f668b-eaab-4a61-914a-190c7a924419)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          # Get ACR credentials
          acrUsername=$(az acr credential show --name $(acrName) --query username -o tsv)
          acrPassword=$(az acr credential show --name $(acrName) --query passwords[0].value -o tsv)

          echo "Deploying ACI: rg=$(resourceGroup) name=$(containerGroupName) image=$(acrLoginServer)/$(imageName):$(tag)"

          # Create ACI with Azure File Share mount and run the agent
          # No inbound ports are required for Azure Pipelines self-hosted agents.
          az container create --resource-group $(resourceGroup) --name $(containerGroupName) \
            --image $(acrLoginServer)/$(imageName):$(tag) \
            --registry-username "$acrUsername" --registry-password "$acrPassword" \
            --os-type Linux \
            --ip-address Private \
            --cpu 1 --memory 1.5 \
            --restart-policy Always \
            --azure-file-volume-account-name $(storageAccountName) \
            --azure-file-volume-account-key "$(storageAccountKey)" \
            --azure-file-volume-share-name $(fileShareName) \
            --azure-file-volume-mount-path /azp/_work \
            --environment-variables AZP_URL='$(System.CollectionUri)' AZP_TOKEN='$(System.AccessToken)' AZP_AGENT_NAME='aci-agent' AZP_POOL='$(agentPoolName)'

          # For autoscaling, you can set up Azure Monitor autoscale rules based on CPU or custom metrics.
          # Example: az monitor autoscale create --resource /subscriptions/... --name autoscale --target /subscriptions/.../containerGroups/$(containerGroupName) --min-count 1 --max-count 5 --count 1

- stage: Test
  dependsOn: DeployACI
  condition: eq('${{ parameters.action }}', 'deploy')
  jobs:
  - job: TestAzCli
    pool:
      name: $(agentPoolName)
    steps:
    - script: |
        az version
      displayName: 'Test Azure CLI Version'

- stage: DestroyACI
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - job: Destroy
    steps:
    - task: AzureCLI@2
      displayName: 'Destroy Azure Container Instance'
      inputs:
        azureSubscription: 'CL-demo-sub1(648f668b-eaab-4a61-914a-190c7a924419)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Delete the ACI instance (the agent will be detached automatically when the container is stopped)
          az container delete \
            --resource-group $(resourceGroup) \
            --name $(containerGroupName) \
            --yes
