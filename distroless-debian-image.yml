# This pipeline builds OpenJDK (Amazon's Corretto) base images. # Build is based on Google's
# distroless Debian image (https://github.com/GoogleContainerTools/distroless)
#
# Before final image is pushed to ACR, it's scanned by Aqua Scanner. If image doesn't pass Aqua's policy,
# pipeline is stopped and image isn't pushed to ACR. To resolve it, you need either to fix the CVE(s),
# or acknowledge each CVE in Aqua's web-UI under CI/CD tab.
#
# Resulting image name is:
# distroless-base-debian12-corretto[8|11|17|21]
# Resulting tag name is:
# latest-$date-$buildIdClean (e.g., latest-20251231-20251231123456)
#
# Google's distroless image versioning:
# - Major Debian's version is set by "baseImageDebianVersion" variable
# - Always latest minor version is pulled
#
# Corretto versioning:
# - Major version is set by "correttoVersionMajor" variable
# - Always latest minor version is downloaded

# Started by hand: the registry name and service connection are entered at run time.
trigger: none

parameters:
  - name: acrName
    displayName: "Azure Container Registry host name (for example myregistry.azurecr.io):"
    type: string
  - name: acrServiceConnection
    displayName: "Azure DevOps Docker registry service connection for that registry:"
    type: string
  # Debian release version
  - name: baseImageDebianVersion
    displayName: "Select Debian major release version:"
    type: number
    default: 12
    values:
    - 12
  # GCR's distroless-base-image type
  # Passed to Dockerfile and used by FROM command
  # base: includes glibc and openssl (a JDK needs them, so only base is offered)
  # More info at https://github.com/GoogleContainerTools/distroless
  - name: baseImageFlavor
    displayName: "Select GCR image type:"
    type: string
    default: base
    values:
    - base
  # Corretto's version to download and build image with
  - name: correttoVersionMajor
    displayName: "Select Corretto major version:"
    type: number
    default: 21
    values:
    - 8
    - 11
    - 17
    - 21

variables:
  # ACR where to push the new image: entered when the pipeline is run
  - name: acrName
    value: ${{ parameters.acrName }}
  # Options: static, base
  - name: baseImageFlavor
    value: ${{ parameters.baseImageFlavor }}
  # Passed to Dockerfile and used by FROM command
  # Options: "10", "11"
  - name: baseImageDebianVersion
    value: ${{ parameters.baseImageDebianVersion }}
  - name: correttoVersionMajor
    value: ${{ parameters.correttoVersionMajor }}
  # Global variable to be used in different tasks/jobs/stages
  - name: correttoVersionFull
    value: "willBeSetByBashTask"
  # Global variable to be used in different tasks/jobs/stages
  - name: baseImageName
    value: "willBeSetByBashTask"
    # Global variable to be used in different tasks/jobs/stages
  - name: imageName
    value: "willBeSetByBashTask"
  # Global variable to be used in different tasks/jobs/stages
  - name: imageTag
    value: "willBeSetByBashTask"
  # Dokerfile argument passed to "docker build"
  - name: dockerfilePath
    value: "willBeSetByBashTask"
  - name: trivyVersion
    value: '0.50.1'

pool:
  vmImage: ubuntu-latest

jobs:
- job:
  displayName: Build distroless Debian-based image (based on gcr.io/distroless) with Amazon Corretto OpenJDK
  timeoutInMinutes: 60
  steps:
  - script: |
      if ! printf '%s' "$ACR_NAME" | grep -Eq '^[a-z0-9][a-z0-9-]*(\.[a-z0-9-]+)+$'; then
        echo "##vso[task.logissue type=error]acrName must be a registry host name such as myregistry.azurecr.io"
        exit 1
      fi
    displayName: "Check the registry name"
    env:
      ACR_NAME: ${{ parameters.acrName }}

  - checkout: self
  
  - script: |
      wget https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.tar.gz
      tar -xzf trivy_$(trivyVersion)_Linux-64bit.tar.gz
      sudo mv trivy /usr/local/bin/
      trivy -v
    displayName: 'Download and install Trivy'

  - task: Bash@3
    continueOnError: false
    displayName: "Prepare variables"
    inputs:
      targetType: 'inline'
      script: |
        DATE="$(date +%Y%m%d)"
        BUILD_ID_CLEAN=$(echo $BUILD_BUILDID | sed 's/-//g')
        BASE_IMAGE_NAME="$(baseImageFlavor)-debian$(baseImageDebianVersion)"
        IMAGE_NAME="distroless-$(baseImageFlavor)-debian$(baseImageDebianVersion)-corretto$(correttoVersionMajor)"
        IMAGE_TAG="latest-${DATE}-${BUILD_ID_CLEAN}"
        DOCKER_FILE_PATH="dockerfiles/distroless-deb12-corretto"
        echo "##vso[build.updatebuildnumber]${IMAGE_TAG}"
        echo "##vso[task.setvariable variable=correttoVersionFull]latest"
        echo "##vso[task.setvariable variable=baseImageName]${BASE_IMAGE_NAME}"
        echo "##vso[task.setvariable variable=imageName]${IMAGE_NAME}"
        echo "##vso[task.setvariable variable=imageTag]${IMAGE_TAG}"
        echo "##vso[task.setvariable variable=dockerfilePath]${DOCKER_FILE_PATH}"

  - task: Docker@2
    continueOnError: false
    displayName: "Build Docker image"
    inputs:
      command: build
      containerRegistry: ${{ parameters.acrServiceConnection }}
      repository: $(imageName)
      addPipelineData: true
      Dockerfile: $(dockerfilePath)
      tags: |
        $(imageTag)
        latest
      arguments: |
        --build-arg CORRETTO_MAJOR=$(correttoVersionMajor)
        --build-arg DEBIAN_VERSION=$(baseImageDebianVersion)
        --build-arg VERSION=$(imageTag)
  
  - task: Docker@2
    displayName: "Pushing image to ACR $(acrName)"
    inputs:
      containerRegistry: ${{ parameters.acrServiceConnection }}
      repository: $(imageName)
      tags: |
        $(imageTag)
        latest
      command: push

  - task: CmdLine@2
    displayName: "Run trivy scan"
    inputs:
      script: |
        # trivy image --exit-code 0 --severity LOW,MEDIUM $(acrName)/$(imageName):$(imageTag)
        # trivy image --exit-code 1 --severity HIGH,CRITICAL $(acrName)/$(imageName):$(imageTag)
        ls -lha
        echo CRITICAL SCAN START
         trivy image --format table --severity HIGH,CRITICAL $(acrName)/$(imageName):$(imageTag)
         trivy image --exit-code 0 --timeout 10m0s --severity HIGH,CRITICAL  --scanners vuln --format template --template "@template/junit.tpl" -o junit-report-high-crit.xml $(acrName)/$(imageName):$(imageTag)
        echo NON-CRITICAL SCAN START
         trivy image --format table --severity MEDIUM,LOW $(acrName)/$(imageName):$(imageTag)
         trivy image --exit-code 1 --timeout 10m0s --severity MEDIUM,LOW --format template --template "@template/junit.tpl" -o junit-report-low-med.xml $(acrName)/$(imageName):$(imageTag)
        # trivy image --exit-code 0 --severity LOW,MEDIUM $(acrName)/$(imageName):$(imageTag) > $(Build.ArtifactStagingDirectory)/_buildOutput/$(imageName)-$(imageTag)-medium-low.txt
        # trivy image --exit-code 1 --severity HIGH,CRITICAL $(acrName)/$(imageName):$(imageTag) > $(Build.ArtifactStagingDirectory)/_buildOutput/$(imageName)-$(imageTag)-critical-high.txt
         ls -lha
        echo SCAN FINISHED

 

  - task: PublishTestResults@2
    displayName: "Publish critical scan result"
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit-report-high-crit.xml'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: 'Trivy - High and Critical Vulnerabilities'
    condition: 'always()'  

  - task: PublishTestResults@2
    displayName: "Publish non-critical scan result"
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit-report-low-med.xml'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: 'Trivy - Low and Medium Vulnerabilities'
    condition: 'always()'  
 
  - task: CopyFiles@2
    inputs:
      contents: '_buildOutput/**'
      targetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)
      artifactName: ScanReports